<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&amp;display=swap');
      .title-white { font-family: 'Montserrat', -apple-system, sans-serif; font-weight: 900; fill: #ffffff; }
      .title-cyan { font-family: 'Montserrat', -apple-system, sans-serif; font-weight: 800; fill: #009dff; }
    </style>
  </defs>

  <!-- Dark Navy Blue Background -->
  <rect width="512" height="512" fill="#071330" rx="96" />

  <g transform="translate(0, -6)">
    <!-- Smartphone Outline -->
    <rect 
      x="184" 
      y="92" 
      width="144" 
      height="208" 
      rx="32" 
      fill="#071330" 
      stroke="#009dff" 
      stroke-width="14" 
    />
    
    <!-- Phone Top Speaker Slot -->
    <rect 
      x="236" 
      y="110" 
      width="40" 
      height="7" 
      rx="3.5" 
      fill="#009dff" 
    />
    
    <!-- Phone Bottom Home Button -->
    <circle 
      cx="256" 
      cy="278" 
      r="9" 
      fill="#009dff" 
    />

    <!-- Chimney on Right side of roof -->
    <path 
      d="M300 170 V132 H322 V186 Z" 
      fill="#ffffff" 
    />

    <!-- House Walls / Body Outline -->
    <path 
      d="M 194 195 V 262 H 318 V 195" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="15" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Roof Peak (White thick outline) -->
    <path 
      d="M 160 200 L 256 126 L 352 200" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="17" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- 4 Window Panes (2x2 Grid) -->
    <g transform="translate(232, 185)">
      <rect x="0" y="0" width="20" height="20" rx="2" fill="#009dff" />
      <rect x="27" y="0" width="20" height="20" rx="2" fill="#009dff" />
      <rect x="0" y="27" width="20" height="20" rx="2" fill="#009dff" />
      <rect x="27" y="27" width="20" height="20" rx="2" fill="#009dff" />
    </g>
  </g>

  <!-- Typography: "Meu aluguel" -->
  <g transform="translate(256, 368)">
    <text 
      x="-72" 
      y="0" 
      text-anchor="middle"
      class="title-white"
      font-size="64" 
      letter-spacing="-1"
    >Meu</text>
    
    <text 
      x="62" 
      y="0" 
      text-anchor="middle"
      class="title-cyan"
      font-size="64" 
      letter-spacing="-1.5"
    >aluguel</text>

    <!-- Curved Underline under "aluguel" -->
    <path 
      d="M -45 28 Q 70 12 180 28" 
      fill="none" 
      stroke="#009dff" 
      stroke-width="7" 
      stroke-linecap="round" 
    />
  </g>
</svg>
